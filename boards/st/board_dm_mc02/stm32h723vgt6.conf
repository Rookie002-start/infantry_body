# board_dm_mc02 板级配置
CONFIG_HAS_CMSIS_CORE=y

# 经典 CAN（非 FD）：仲裁段 1 Mbps
# 上下板通信走拆帧（见 inter_cmd.hpp），不再使用 FD 数据段
CONFIG_CAN=y

# 上下板通信（fdcan2 / user-can2）— 仅本板有该总线，故按板级开启
#   发送：Dir::Down 状态分片（云台角/弹速…）→ 0x200
#   接收：Dir::Up 聚合状态帧 0x100 + 命令帧 0x111~0x114
# 注意：发送线程持有总线（Init + 收帧分发入口），接收线程只注册 CAN_RX_HANDLER
CONFIG_TRD_MCU_INTER=y
CONFIG_TRD_INTER_RX=y

# 底盘（本板即下板）：user-can1 上的 4 台 C620/M3508
#   收：0x201~0x204 反馈 → .can_rx1 → DjiC620
#   发：0x200 控制帧 ← topic::to_can_tx 队列（由 TRD_CAN 的发送线程发出）
# 姿态/自瞄等上层逻辑放在上板，本板只跑底盘闭环（功率限制待接入）
CONFIG_TRD_CHASSIS=y

# 云台（user-can3 / fdcan3）：yaw + pitch 两台 DM 电机，1ms 双环
#   收：DM 反馈帧（master_id 0x02 / 0x01）→ .can_rx3
#   发：DM 控制帧 ← topic::to_can_tx 的 user_can3_msgq（本线程持有总线）
#   角度反馈默认用电机编码器；改用 IMU 绝对角时打开下面两行
CONFIG_TRD_GIMBAL=y

# HPM5361ICB 调试用 OpenOCD 配置（J-Link / JTAG）
#
# 供 .vscode/launch.json 的 "HPM5361 调试 (J-Link JTAG)" 使用，由 VS Code 这样拉起：
#   openocd -s <hpm_sdk>/boards/openocd -f <本文件>
#
# 需要的搜索路径由 launch.json 的 debugServerArgs 里的 -s 提供，
# 与 boards/hpm/hpm5361icb/board.cmake / runners.yaml 保持一致。

source [find probes/jlink.cfg]
adapter speed 500

source [find soc/hpm5300.cfg]
source [find boards/hpm5300evk.cfg]
